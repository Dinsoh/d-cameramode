<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photography</title><link rel="stylesheet" href="style.css"></head>
<body><div id="frame" hidden><div id="bars" hidden></div><div id="grid" hidden><i></i><i></i><i></i><i></i></div>
<main id="panel"><header><div><small>DINSOH DEVELOPMENT</small><h1>Photography</h1></div><button id="close" aria-label="Exit photography">×</button></header>
<section id="orbit" hidden><div class="angles" aria-label="Camera angles"><button data-angle="0">Front</button><button data-angle="90">Left</button><button data-angle="180">Back</button><button data-angle="-90">Right</button></div>
<label>Angle <output id="angleValue"></output><input id="angle" type="range" min="-180" max="180" step="1" value="0"></label>
<label>Distance <output id="distanceValue"></output><input id="distance" type="range" step="0.05"></label>
<label>Height <output id="heightValue"></output><input id="height" type="range" step="0.05"></label></section>
<label>Focal view <output id="fovValue"></output><input id="fov" type="range" step="1"></label>
<label>Roll <output id="tiltValue"></output><input id="tilt" type="range" step="1" value="0"></label>
<label>Color grade<select id="filter"></select></label>
<div class="row"><label><input id="showGrid" type="checkbox"> Thirds grid</label><label><input id="showBars" type="checkbox"> Cinema bars</label></div>
<section id="depth" hidden><label class="row"><span>Depth of field</span><input id="dof" type="checkbox"></label><label>Focus distance <output id="focusValue"></output><input id="focus" type="range" min="1" max="50" step="0.5" value="5"></label></section>
<footer><button id="hide">Hide overlay</button><button id="reset">Reset</button><p id="hint"></p><p id="error" role="status" hidden>Control unavailable. Press Escape to exit.</p></footer>
</main></div><script src="app.js"></script></body></html>
